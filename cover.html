<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box} html,body{margin:0;padding:0} .slide-container{width:1280px;min-height:720px;background:#e8ecef;color:#2c3e50;padding:72px 72px 0;display:flex;align-items:center;justify-content:space-between;font-family:Georgia,serif}.copy{width:58%}.eyebrow{font-family:monospace;font-weight:700;letter-spacing:2px;color:#27ae60;font-size:20px;margin-bottom:26px}.title{font-family:monospace;font-weight:700;font-size:58px;line-height:1.12;margin:0 0 24px}.subtitle{font-size:28px;line-height:1.45;color:#34495e;max-width:650px}.visual{width:400px;min-height:360px;position:relative;direction:ltr}.node{position:absolute;width:22px;height:22px;border-radius:50%;background:#27ae60}.n1{left:40px;top:60px}.n2{left:190px;top:125px;background:#2c3e50}.n3{left:300px;top:42px;background:#e67e22}.n4{left:100px;top:260px;background:#2c3e50}.n5{left:285px;top:290px;background:#27ae60}.line{position:absolute;border-top:2px dashed #7f8c8d;transform-origin:left center;width:170px}.l1{left:58px;top:76px;transform:rotate(24deg)}.l2{left:208px;top:137px;transform:rotate(-25deg)}.l3{left:58px;top:76px;transform:rotate(61deg);width:215px}.l4{left:118px;top:270px;transform:rotate(8deg);width:180px}.bracket{position:absolute;inset:15px 5px 10px 5px;border:3px solid #2c3e50;border-left:none}.bracket:before{content:'[  DATA  →  SIGNAL  →  SCORE  ]';position:absolute;bottom:-32px;left:0;font:700 16px monospace;color:#2c3e50;direction:ltr}
</style>
</head>
<body>
<div class="slide-container">
  <div class="copy">
    <div class="eyebrow">عرض توضيحي تقني</div>
    <h1 class="title">Facebook<br>Comment Analyzer</h1>
    <div class="subtitle">كيف نحلّل تعليقات المنشور ونرصد الحسابات غير الموثوقة؟</div>
  </div>
  <div class="visual">
    <div class="bracket"></div>
    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>
    <div class="node n1"></div>
    <div class="node n2"></div>
    <div class="node n3"></div>
    <div class="node n4"></div>
    <div class="node n5"></div>
  </div>
</div>
</body>
</html>
